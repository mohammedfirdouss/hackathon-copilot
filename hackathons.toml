# The hackathons I'm entering. The co-pilot agent reads this file and edits it
# when I tell it something is done. Deadlines carry their own UTC offset.
#
# check types:
#   manual            done = true/false, set by me (through the agent)
#   repo_public       the hackathon's repo is public on GitHub
#   repo_has_license  the repo has a license GitHub recognises
#   readme_mentions   the README contains `arg` (case-insensitive)
#   url_up            `arg` answers with HTTP 2xx/3xx
#   starred           I have starred the repo `arg`

timezone = "Africa/Lagos"

